# XcodeGen spec (mục 19.1): Xcode project chỉ chứa các target; mã nằm trong Swift package `Packages/`.
# Sinh project: `xcodegen generate` (hoặc `Scripts/build-app.sh`).
name: MashClean
options:
  bundleIdPrefix: com.cleanboost
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      # Universal (arm64 + x86_64), mục 1.3
      ARCHS: "$(ARCHS_STANDARD)"
      ONLY_ACTIVE_ARCH: NO

packages:
  MashCleanKit:
    path: Packages
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  # App chính (quyền người dùng + FDA): UI, Scan Engine, Clean Engine
  MashClean:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: Localization
        excludes: ["*.json"]
      - path: App/Resources/Assets.xcassets
        optional: true
      - path: App/Resources/Rules
        type: folder
        buildPhase: resources
      - path: Helper/com.cleanboost.mac.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_NAME: "Clean Boost"
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanboost.mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: "App/MashClean$(MASHCLEAN_ENTITLEMENTS_VARIANT).entitlements"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MashCleanKit
        product: MashCleanAppKit
      - package: Sparkle
        product: Sparkle
      - target: MashCleanMenu
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - target: MashCleanHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/HelperTools
      - target: MashCleanFinder
        embed: true
        codeSign: true
      - target: MashCleanIntents
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Extensions
    scheme:
      environmentVariables:
        MASHCLEAN_DRY_RUN: "0"

  # Login item: menu bar + monitor (SMAppService.loginItem)
  MashCleanMenu:
    type: application
    platform: macOS
    sources:
      - path: MenuBar
      - path: Localization
        excludes: ["*.json"]
    settings:
      base:
        PRODUCT_NAME: CleanBoostMenu
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanboost.mac.menu
        INFOPLIST_FILE: MenuBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: "MenuBar/MenuBar$(MASHCLEAN_ENTITLEMENTS_VARIANT).entitlements"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: MashCleanKit
        product: MashCleanMenuKit

  # Helper root (LaunchDaemon qua SMAppService.daemon), command-line tool
  MashCleanHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - "com.cleanboost.mac.helper.plist"
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: com.cleanboost.mac.helper
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanboost.mac.helper
        INFOPLIST_FILE: Helper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: Helper/Helper.entitlements
        SKIP_INSTALL: YES
        OTHER_CODE_SIGN_FLAGS: "$(inherited) --identifier com.cleanboost.mac.helper"
    dependencies:
      - package: MashCleanKit
        product: MashCleanHelperKit

  # Menu chuột phải trong Finder
  MashCleanFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/FinderSync
        excludes: ["*.entitlements"]
      - path: Localization
        excludes: ["*.json"]
    settings:
      base:
        PRODUCT_NAME: CleanBoostFinder
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanboost.mac.FinderSync
        INFOPLIST_FILE: Extensions/FinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: "Extensions/FinderSync/FinderSync$(MASHCLEAN_ENTITLEMENTS_VARIANT).entitlements"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  # Shortcuts / Siri (App Intents extension)
  MashCleanIntents:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Extensions/AppIntents
      - path: Localization
        excludes: ["*.json"]
    settings:
      base:
        PRODUCT_NAME: CleanBoostIntents
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanboost.mac.Intents
        INFOPLIST_FILE: Extensions/AppIntents/Info.plist
        CODE_SIGN_ENTITLEMENTS: "Extensions/AppIntents/AppIntents$(MASHCLEAN_ENTITLEMENTS_VARIANT).entitlements"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  # Bản Mac App Store: cùng mã nguồn, bật App Sandbox, không nhúng helper root và Sparkle.
  # Tính năng cần root/launchctl tự ẩn khi chạy trong sandbox (AppEdition.isAppStore).
  MashCleanAppStore:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: Localization
        excludes: ["*.json"]
      - path: App/Resources/Assets.xcassets
        optional: true
      - path: App/Resources/Rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "Clean Boost"
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanboost.mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: "App/MashClean.appstore$(MASHCLEAN_ENTITLEMENTS_VARIANT).entitlements"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MashCleanKit
        product: MashCleanAppKit
      - target: MashCleanMenuAppStore
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - target: MashCleanFinder
        embed: true
        codeSign: true
      - target: MashCleanIntents
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Extensions
    scheme:
      environmentVariables:
        MASHCLEAN_DRY_RUN: "0"

  # Menu bar của bản Mac App Store (login item bật sandbox)
  MashCleanMenuAppStore:
    type: application
    platform: macOS
    sources:
      - path: MenuBar
        excludes: ["*.entitlements"]
      - path: Localization
        excludes: ["*.json"]
    settings:
      base:
        PRODUCT_NAME: CleanBoostMenu
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanboost.mac.menu
        INFOPLIST_FILE: MenuBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: "MenuBar/MenuBar.appstore$(MASHCLEAN_ENTITLEMENTS_VARIANT).entitlements"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: MashCleanKit
        product: MashCleanMenuKit
